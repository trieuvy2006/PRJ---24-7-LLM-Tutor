<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor Chat Demo</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="page-shell">
    <section class="chat-panel">
        <h1>AI Tutor Chat</h1>
        <form class="chat-form">
            <label for="question">Question</label>
            <textarea id="question" name="question" rows="5" placeholder="Ask the AI tutor...">Explain MVC architecture in Java Web.</textarea>
            <button type="button">Send</button>
        </form>

        <div class="answer-box">
            <h2>Answer</h2>
            <p>This is a static HTML demo screen. The JSP and Servlet version will handle real requests when the project runs on Tomcat.</p>
        </div>

        <p class="page-link">
            <a href="history.html">View question history</a>
        </p>
    </section>
</main>
</body>
</html>
